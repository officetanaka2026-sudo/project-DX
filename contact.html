<div class="page-head"><div class="wrap"><h1>無料相談・お問い合わせ</h1></div></div><section><div class="wrap">
<p class="lead">内容を確認し、2営業日以内にご返信します。ご相談・お見積りは無料です。</p>
<div class="article"><form id="f" onsubmit="event.preventDefault();document.getElementById('msg').hidden=false;">
<label>ご相談の種類</label><select name="type"><option>ホームページを作りたい</option><option>今のホームページを直したい</option><option>業務ツール・Excel・スプレッドシート</option><option>AIを仕事に取り入れたい</option><option>その他・配信停止</option></select>
<label>会社名・店名</label><input name="company">
<label>お名前（必須）</label><input name="name" required>
<label>ご連絡先メールアドレス（必須）</label><input name="email" type="email" required>
<label>ご相談内容（必須）</label><textarea name="body" rows="7" required placeholder="例）今はホームページがなく、電話で予約を受けています。スマホから予約できるようにしたいです。"></textarea>
<p class="note">送信いただいた情報は<a href="privacy.html">プライバシーポリシー</a>に沿って取り扱います。</p>
<p><button class="btn" type="submit">送信する</button></p>
<p id="msg" hidden>※送信機能は準備中です。</p>
</form></div></div></section><footer><div class="wrap">
