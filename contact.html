<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>無料相談・お問い合わせ｜中小企業DX研究所</title>
<meta name="description" content="ホームページ制作・業務ツール・AI導入の無料相談はこちら。">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<header><div class="wrap"><a class="logo" href=""><i>DX</i>中小企業DX研究所</a>
<nav><a href="#service">サービス</a><a href="#price">料金</a><a href="#works">制作例</a><a href="about.html">運営者</a><a class="cta" href="contact.html">無料相談</a></nav></div></header>
<div class="page-head"><div class="wrap"><h1>無料相談・お問い合わせ</h1></div></div><section><div class="wrap">
<p class="lead">内容を確認し、2営業日以内にご返信します。ご相談・お見積りは無料です。</p>
<div class="article"><form id="f">
<input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
<label>ご相談の種類</label><select name="type"><option>ホームページを作りたい</option><option>今のホームページを直したい</option><option>業務ツール・Excel・スプレッドシート</option><option>AIを仕事に取り入れたい</option><option>その他・配信停止</option></select>
<label>会社名・店名</label><input name="company">
<label>お名前（必須）</label><input name="name" required>
<label>ご連絡先メールアドレス（必須）</label><input name="email" type="email" required>
<label>ご相談内容（必須）</label><textarea name="body" rows="7" required placeholder="例）今はホームページがなく、電話で予約を受けています。スマホから予約できるようにしたいです。"></textarea>
<p class="note">送信いただいた情報は<a href="privacy.html">プライバシーポリシー</a>に沿って取り扱います。</p>
<p><button class="btn" type="submit" id="sb">送信する</button></p>
<p id="msg" role="status"></p>
</form>
<script>
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const f=e.target,m=document.getElementById('msg'),b=document.getElementById('sb');b.disabled=true;m.textContent='送信中です…';
try{const r=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});const j=await r.json();
if(j.ok){f.reset();m.textContent='送信しました。2営業日以内にご返信します。';}else{m.textContent=j.error||'送信に失敗しました。';b.disabled=false;}}catch(_){m.textContent='送信に失敗しました。時間をおいて再度お試しください。';b.disabled=false;}});
</script></div></div></section><footer><div class="wrap">
<p><a href="">トップ</a><a href="tools/mitsumori/">ツール見本</a><a href="about.html">運営者情報</a><a href="privacy.html">プライバシーポリシー</a><a href="contact.html">お問い合わせ</a></p>
<p>© 中小企業DX研究所</p></div></footer>
</body></html>
